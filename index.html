<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <title>TacoCat Avatar Creator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">TACOCAT LABS // PROTOTYPE</p>
        <h1>Build Your TacoCat</h1>
        <p class="subtitle">Customize your own crew member and save the result as an image.</p>
      </div>
      <div class="signal">📡 SIGNAL ONLINE</div>
    </header>

    <section class="creator-grid">
      <article class="preview-card">
        <div class="preview-top">
          <span>AVATAR PREVIEW</span>
          <span id="chapterBadge">CHAPTER 01</span>
        </div>

        <div id="avatarCanvas" class="avatar-canvas">
          <svg id="avatarSvg" viewBox="0 0 600 600" role="img" aria-label="Custom TacoCat avatar">
            <defs>
              <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#101b3f"/>
                <stop offset="100%" stop-color="#23113d"/>
              </linearGradient>
              <filter id="shadow">
                <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".35"/>
              </filter>
            </defs>

            <rect width="600" height="600" rx="42" fill="url(#bgGlow)"/>
            <circle cx="490" cy="95" r="75" fill="#ffffff" opacity=".05"/>
            <circle cx="115" cy="475" r="95" fill="#ffffff" opacity=".035"/>

            <g id="tacoHat" filter="url(#shadow)">
              <path d="M165 220 Q300 80 435 220 Z" fill="#f0b84b" stroke="#5e3a10" stroke-width="12"/>
              <path d="M195 207 Q300 120 405 207" fill="none" stroke="#ffd879" stroke-width="18" stroke-linecap="round"/>
              <circle cx="242" cy="173" r="15" fill="#55b95a"/>
              <circle cx="295" cy="145" r="14" fill="#d94a44"/>
              <circle cx="350" cy="175" r="16" fill="#55b95a"/>
              <path d="M220 190 Q300 145 380 190" fill="none" stroke="#734d23" stroke-width="14" stroke-linecap="round"/>
            </g>

            <g id="catBody" filter="url(#shadow)">
              <path id="body" d="M205 365 Q205 295 260 278 L340 278 Q395 295 395 365 L418 505 Q300 555 182 505 Z"
                    fill="#d89a62" stroke="#2f1d1d" stroke-width="12"/>
              <circle id="head" cx="300" cy="300" r="112" fill="#d89a62" stroke="#2f1d1d" stroke-width="12"/>
              <path id="leftEar" d="M215 235 L210 120 L285 205 Z" fill="#d89a62" stroke="#2f1d1d" stroke-width="12"/>
              <path id="rightEar" d="M385 235 L390 120 L315 205 Z" fill="#d89a62" stroke="#2f1d1d" stroke-width="12"/>
              <path d="M226 213 L225 159 L265 210 Z" fill="#efb0b0" opacity=".9"/>
              <path d="M374 213 L375 159 L335 210 Z" fill="#efb0b0" opacity=".9"/>

              <g id="face">
                <ellipse id="leftEye" cx="260" cy="292" rx="22" ry="28" fill="#69d2ff"/>
                <ellipse id="rightEye" cx="340" cy="292" rx="22" ry="28" fill="#69d2ff"/>
                <ellipse cx="265" cy="284" rx="6" ry="8" fill="#fff" opacity=".85"/>
                <ellipse cx="345" cy="284" rx="6" ry="8" fill="#fff" opacity=".85"/>
                <path d="M289 330 Q300 340 311 330 Q300 353 289 330" fill="#7c3c49"/>
                <path d="M300 341 Q280 359 267 343" fill="none" stroke="#2f1d1d" stroke-width="7" stroke-linecap="round"/>
                <path d="M300 341 Q320 359 333 343" fill="none" stroke="#2f1d1d" stroke-width="7" stroke-linecap="round"/>
                <path d="M225 333 L158 322 M225 350 L155 351 M375 333 L442 322 M375 350 L445 351"
                      stroke="#2f1d1d" stroke-width="6" stroke-linecap="round"/>
              </g>

              <g id="outfitClassic">
                <path d="M194 395 Q300 350 406 395 L418 505 Q300 555 182 505 Z"
                      fill="#121a31" stroke="#2f1d1d" stroke-width="10"/>
                <path d="M260 383 L300 427 L340 383" fill="none" stroke="#e9b949" stroke-width="10"/>
                <circle cx="300" cy="466" r="36" fill="#e9b949"/>
                <text x="300" y="478" text-anchor="middle" font-size="34" font-weight="900" fill="#121a31">TC</text>
              </g>

              <g id="outfitHoodie" style="display:none">
                <path d="M184 390 Q300 340 416 390 L430 515 Q300 565 170 515 Z"
                      fill="#7a45d6" stroke="#2f1d1d" stroke-width="10"/>
                <path d="M225 390 Q300 330 375 390" fill="none" stroke="#a77cf0" stroke-width="24"/>
                <path d="M250 425 L238 472 M350 425 L362 472" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
              </g>

              <g id="outfitSpace" style="display:none">
                <path d="M180 395 Q300 350 420 395 L432 515 Q300 565 168 515 Z"
                      fill="#e7edf7" stroke="#2f1d1d" stroke-width="10"/>
                <path d="M205 420 L395 420" stroke="#364a6e" stroke-width="12"/>
                <rect x="245" y="440" width="110" height="58" rx="14" fill="#263656"/>
                <circle cx="273" cy="469" r="9" fill="#69d2ff"/>
                <circle cx="300" cy="469" r="9" fill="#f3c94b"/>
                <circle cx="327" cy="469" r="9" fill="#ef6a6a"/>
              </g>

              <g id="accessoryGlasses" style="display:none">
                <rect x="224" y="267" width="72" height="48" rx="18" fill="none" stroke="#111827" stroke-width="10"/>
                <rect x="304" y="267" width="72" height="48" rx="18" fill="none" stroke="#111827" stroke-width="10"/>
                <path d="M296 288 L304 288 M224 286 L190 276 M376 286 L410 276"
                      stroke="#111827" stroke-width="9" stroke-linecap="round"/>
              </g>

              <g id="accessoryHeadset" style="display:none">
                <path d="M210 290 Q210 190 300 180 Q390 190 390 290"
                      fill="none" stroke="#1b243b" stroke-width="20" stroke-linecap="round"/>
                <rect x="190" y="265" width="35" height="75" rx="14" fill="#273453"/>
                <rect x="375" y="265" width="35" height="75" rx="14" fill="#273453"/>
                <path d="M390 330 Q410 370 350 382" fill="none" stroke="#273453" stroke-width="9"/>
                <circle cx="347" cy="382" r="10" fill="#69d2ff"/>
              </g>

              <g id="accessoryBandana" style="display:none">
                <path d="M206 235 Q300 270 394 235 L380 274 Q300 300 220 274 Z"
                      fill="#e54b4b" stroke="#2f1d1d" stroke-width="7"/>
                <path d="M388 250 L455 210 L420 280 Z" fill="#e54b4b" stroke="#2f1d1d" stroke-width="7"/>
              </g>

              <g id="feminineDetails" style="display:none">
                <path d="M221 265 Q245 245 270 263" fill="none" stroke="#2f1d1d" stroke-width="7" stroke-linecap="round"/>
                <path d="M330 263 Q355 245 379 265" fill="none" stroke="#2f1d1d" stroke-width="7" stroke-linecap="round"/>
                <path d="M375 196 Q420 165 435 205 Q415 235 375 218 Z" fill="#ef5f9b" stroke="#2f1d1d" stroke-width="7"/>
                <circle cx="402" cy="206" r="12" fill="#ffd4e7"/>
              </g>
            </g>

            <g id="lockedOverlay" style="display:none">
              <rect x="70" y="70" width="460" height="460" rx="35" fill="#050814" opacity=".78"/>
              <text x="300" y="270" text-anchor="middle" font-size="64">🔒</text>
              <text x="300" y="330" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">ACCESSORY LOCKED</text>
              <text x="300" y="370" text-anchor="middle" font-size="20" fill="#d2d8e8">Unlocks in Chapter 10</text>
            </g>
          </svg>
        </div>

        <div class="avatar-actions">
          <button id="randomizeBtn" class="secondary-btn">🎲 Randomize</button>
          <button id="downloadBtn" class="primary-btn">⬇ Save Avatar</button>
        </div>
      </article>

      <aside class="controls-card">
        <div class="control-section">
          <h2>Style</h2>
          <div class="segmented">
            <button class="choice active" data-gender="masculine">Masculine</button>
            <button class="choice" data-gender="feminine">Feminine</button>
          </div>
        </div>

        <div class="control-section">
          <h2>Fur Color</h2>
          <div class="swatches" id="furSwatches">
            <button class="swatch active" data-color="#d89a62" style="--swatch:#d89a62" aria-label="Caramel"></button>
            <button class="swatch" data-color="#f3f0e8" style="--swatch:#f3f0e8" aria-label="Cream"></button>
            <button class="swatch" data-color="#656b78" style="--swatch:#656b78" aria-label="Gray"></button>
            <button class="swatch" data-color="#25262b" style="--swatch:#25262b" aria-label="Black"></button>
            <button class="swatch" data-color="#d66f6f" style="--swatch:#d66f6f" aria-label="Coral"></button>
          </div>
        </div>

        <div class="control-section">
          <h2>Eye Color</h2>
          <div class="swatches" id="eyeSwatches">
            <button class="swatch active" data-color="#69d2ff" style="--swatch:#69d2ff"></button>
            <button class="swatch" data-color="#65d98a" style="--swatch:#65d98a"></button>
            <button class="swatch" data-color="#f3c94b" style="--swatch:#f3c94b"></button>
            <button class="swatch" data-color="#bd7cff" style="--swatch:#bd7cff"></button>
            <button class="swatch" data-color="#9b623f" style="--swatch:#9b623f"></button>
          </div>
        </div>

        <div class="control-section">
          <h2>Outfit</h2>
          <div class="option-grid" id="outfitOptions">
            <button class="option active" data-outfit="Classic">🛰️ Crew Suit</button>
            <button class="option" data-outfit="Hoodie">🧥 Signal Hoodie</button>
            <button class="option" data-outfit="Space">🚀 Space Suit</button>
          </div>
        </div>

        <div class="control-section">
          <h2>Accessory</h2>
          <div class="option-grid" id="accessoryOptions">
            <button class="option active" data-accessory="None">None</button>
            <button class="option" data-accessory="Glasses">🕶️ Glasses</button>
            <button class="option" data-accessory="Headset">🎧 Headset</button>
            <button class="option" data-accessory="Bandana">🔻 Bandana</button>
            <button class="option locked" data-accessory="Chapter10">🔒 Chapter 10</button>
          </div>
        </div>

        <div class="status-box">
          <span class="status-dot"></span>
          Prototype mode — no wallet connection required.
        </div>
      </aside>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
